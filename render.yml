services:
  - type: web
    name: queen-cynthia-bot
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: PORT
        value: "3000"
      - key: MONGODB_URI
        sync: false # weka connection string yako ya MongoDB hapa kwenye Render dashboard
      - key: ADMIN_PASSWORD
        sync: false # weka password ya /admin hapa (usiiache kama default)
      - key: ADMIN_SESSION_SECRET
        sync: false # string ya siri ya random kwa ajili ya kusaini session cookie

# MAELEZO:
# - Session (creds za WhatsApp) sasa zinahifadhiwa MongoDB (MONGODB_URI),
#   hivyo hazipotei tena bot ikianzishwa upya / kudeploy - "disk" ya Render
#   haihitajiki tena kwa ajili ya session (tofauti na toleo la awali
#   lililotumia faili za lokali).
# - PORT inasomwa kutoka kwa mazingira (config.js -> process.env.PORT),
#   Render itaweka yake moja kwa moja pia.
